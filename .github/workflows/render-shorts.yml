name: Render Shorts

on:
  workflow_dispatch:
  # Keep rendering manual until storage, licensing, and quality checks are configured.
  # schedule:
  #   - cron: "0 15 * * 6"

permissions:
  contents: read

concurrency:
  group: render-shorts
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render vertical clips
        run: python3 src/make_shorts.py

      - name: Upload rendered clips and metadata
        uses: actions/upload-artifact@v4
        with:
          name: becoming-giant-shorts
          path: output/shorts/
          if-no-files-found: error
          retention-days: 7
